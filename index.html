<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0d10" />
    <title>Qelvo · Typeset, not templated</title>
    <meta name="description" content="Free, open source resume builder. Upload the resume you have, pick a calibrated layout, edit it like code or like a form, and download the exact PDF you see. No sign-up, no watermark." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The hero's front page: start fetching it alongside the JS, not after it runs. -->
    <link rel="preload" as="image" href="/thumbs/modern-640.webp" imagesrcset="/thumbs/modern-640.webp 640w, /thumbs/modern-960.webp 960w, /thumbs/modern-1280.webp 1280w, /thumbs/modern-1920.webp 1920w" imagesizes="370px" fetchpriority="high" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Qelvo" />
    <meta property="og:title" content="Qelvo · Typeset, not templated" />
    <meta property="og:description" content="Free, open source resume builder with a real typesetter. The preview is the PDF." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <style>
      /* First paint, before any JS: a quiet hello that only shows if loading is slow. */
      html:not([data-theme]), html:not([data-theme]) body { margin: 0; background: #0c0d10; }
      @media (prefers-color-scheme: light) { html:not([data-theme]), html:not([data-theme]) body { background: #f4f2ed; } .boot { color: #17181c; } }
      .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 18px; color: #e9ebf0; font: 400 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; opacity: 0; animation: boot-in .6s .35s ease forwards; text-align: center; padding: 24px; }
      .boot svg { width: 56px; height: 56px; }
      .boot .ring { fill: currentColor; opacity: .92; }
      .boot .rule { fill: #ffb547; transform-origin: 46px 50%; animation: rule 1.6s ease-in-out infinite; }
      .boot b { font: italic 400 26px/1.2 Georgia, "Times New Roman", serif; }
      .boot span { opacity: .6; font-size: 14px; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes rule { 0%, 100% { transform: scaleX(.35); } 50% { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot .rule { animation: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading Qelvo">
      <svg viewBox="12 12 76 76" aria-hidden="true"><g transform="translate(-1.88 5)"><path class="ring" d="M70.68 58.75A28.25 28.25 0 1 0 46 73.25L46 62.75A17.75 17.75 0 1 1 57.22 58.75Z"/><rect class="rule" x="46" y="62.75" width="40" height="10.5"/></g></svg>
      <b>Hey you. Take a breath.</b>
      <span>Your fresh start is almost here ☕</span>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
