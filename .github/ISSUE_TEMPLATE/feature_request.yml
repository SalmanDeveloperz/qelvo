name: Feature request
description: Suggest an improvement or a new layout
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. For a layout, link or attach a reference design.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead
